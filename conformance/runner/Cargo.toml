[package]
name = "rule-eval-conformance"
description = "Checks rule-eval and soroban-facade against the conformance vectors generated from the Lean model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
rule-eval = { path = "../../crates/rule-eval" }
soroban-facade = { path = "../../crates/soroban-facade" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
