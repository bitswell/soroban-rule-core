# The harness at the pin: soroban-sdk 29.0.1, which fixes soroban-env-host
# 29.0.1 (protocol 29). Each host version the vectors run on is a crate like
# this one, named soroban-host-p<protocol>, with its own pins, sharing ../src
# and ../tests. This one is a member of the repository's workspace and shares
# its lock with soroban-facade's real implementation; the others are
# workspaces of their own with their own locks (../p30).
[package]
name = "soroban-host-p29"
description = "Replays the Soroban vectors on soroban-env-host 29.0.1 through soroban-sdk 29.0.1's testutils"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Every entry names its library `harness`, so the shared tests import it
# whichever host the entry pins.
name = "harness"
path = "../src/lib.rs"
doctest = false

[[test]]
name = "host"
path = "../tests/host.rs"

[features]
default = ["facade"]
# Storage, require_auth and the reading of __check_auth's contexts go through
# soroban-facade's real implementation, which is built against this SDK.
facade = ["soroban-facade/sdk"]

[dependencies]
rule-eval = { path = "../../../crates/rule-eval" }
rule-eval-conformance = { path = "../../runner" }
sha2 = "0.10"
soroban-facade = { path = "../../../crates/soroban-facade" }
# The host the SDK fixes, named so the harness can set its diagnostic level.
soroban-env-host = "=29.0.1"
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }
