name: Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: lake build
      - name: Maybe
        if: github.event_name == 'push'
        run: lake build
  entries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - entry: a
            features: ""
          - entry: b
            features: --no-default-features
    steps:
      - name: Test
        run: cargo test --locked
