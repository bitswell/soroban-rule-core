[package]
name = "cedar-to-rule-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Deliberately outside the contract/extraction workspace and its lockfile.
[workspace]
resolver = "3"

[dependencies]
cedar-policy = "=4.14.1"
rule-eval = { path = "../../crates/rule-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
