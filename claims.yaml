  # The restricted subset and the build.

  - id: build.no-std-no-unsafe
    claim: rule-eval is no_std, forbids unsafe code and has no dependencies.
    status: tested
    evidence:
      - file: crates/rule-eval/src/lib.rs
        contains: "#![no_std]"
      - file: crates/rule-eval/src/lib.rs
        contains: "#![forbid(unsafe_code)]"
      - file: crates/rule-eval/Cargo.toml
        contains: "[dependencies]\n"
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (release), runs: --target wasm32v1-none}

  - id: build.overflow-checks
    claim: Arithmetic overflow traps in the release and contract profiles.
    status: tested
    evidence:
      - file: Cargo.toml
        contains: "[profile.release]\noverflow-checks = true"
      - file: Cargo.toml
        contains: "[profile.contract]\ninherits = \"release\"\nopt-level = \"z\"\noverflow-checks = true"
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build native (release), runs: --release}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (contract profile), runs: --profile contract}

  - id: build.targets
    claim: >-
      rule-eval builds for native and for wasm32v1-none, in release and in the
      contract profile, on the pinned nightly and on stable.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build native (release), runs: cargo build -p rule-eval --release}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (release), runs: --release --target wasm32v1-none}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (contract profile), runs: --profile contract --target wasm32v1-none}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: Build native (release), runs: build -p rule-eval --release}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: Build wasm32v1-none (release), runs: --release --target wasm32v1-none}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: Build wasm32v1-none (contract profile), runs: --profile contract --target wasm32v1-none}

  - id: build.lint
    claim: The workspace passes clippy with every warning denied, and rustfmt.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: cargo clippy, runs: --all-targets --locked -- -D warnings}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: cargo fmt, runs: cargo fmt --all --check}

  - id: build.pins-agree
    claim: >-
      One Aeneas commit fixes the toolchain: the Charon input equals Aeneas's
      charon-pin, rust-toolchain.toml's channel equals Charon's, and the Lean
      release equals Aeneas's Lean backend's and formal/lean-toolchain;
      evaluating the flake fails otherwise, and the extraction evaluates it.
    status: tested
    evidence:
      - file: flake.nix
        contains: "assert pinsAgree;"
      - file: formal/lakefile.toml
        contains: rev = "ab34bd28458a08c150b7cbf1873e59af74588138"
      - ci: {workflow: .github/workflows/extraction.yml, job: extraction, step: Re-run Charon and Aeneas and compare, runs: tools/extract.sh --check}
      - ci: {workflow: .github/workflows/conformance.yml, job: regenerate, step: The generator uses the Lean release of formal/, runs: cmp formal/lean-toolchain conformance/generator/lean-toolchain}

  # CI gates on the Lean package and the extraction.

  - id: gate.lean-build
    claim: >-
      lake build builds every module of the package, every theorem included:
      RuleCore.lean imports every module, and the build fails otherwise.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: Every module is imported by RuleCore.lean}
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: lake build, runs: lake build}

  - id: gate.forbidden-keywords
    claim: >-
      No Lean source of the package, the translation included, nor of the
      vector generator contains sorry, admit, partial, unsafe, native_decide,
      implemented_by, extern or axiom as a word.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: Reject unchecked declarations, runs: "grep -nwE 'sorry|admit|partial|unsafe|native_decide|implemented_by|extern|axiom'"}
      - ci: {workflow: .github/workflows/conformance.yml, job: regenerate, step: Reject unchecked declarations, runs: "grep -nwE 'sorry|admit|partial|unsafe|native_decide|implemented_by|extern|axiom'"}

  - id: gate.axioms
    claim: >-
      Every theorem of the package depends on at most propext, Quot.sound and
      Classical.choice, and Axioms.lean records the axioms of every exported
      theorem under #guard_msgs, so a new theorem or a change in any theorem's
      axioms fails the build until the record is updated.
    status: tested
    evidence:
      - file: formal/RuleCore/Axioms.lean
        contains: "def permitted : List Name := [``propext, ``Quot.sound, ``Classical.choice]"
      - file: formal/RuleCore/Axioms.lean
        contains: "#guard_msgs in\n#print_package_axioms"
      - file: formal/lakefile.toml
        contains: roots = ["RuleCore", "RuleCore.Axioms"]
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: lake build, runs: lake build}

  - id: gate.extraction
    claim: >-
      formal/RuleCore/Extracted/RuleEval.lean is what Charon
      (--error-on-warnings) and Aeneas (-warnings-as-errors) generate from
      crates/rule-eval at the pinned versions; CI regenerates it and fails on
      any difference.
    status: tested
    evidence:
      - file: tools/extract.sh
        contains: "--preset=aeneas --error-on-warnings"
      - file: tools/extract.sh
        contains: "aeneas -backend lean -warnings-as-errors -abort-on-error"
      - ci: {workflow: .github/workflows/extraction.yml, job: extraction, step: Re-run Charon and Aeneas and compare, runs: tools/extract.sh --check}

  - id: gate.claims
    claim: >-
      Every claim in this ledger cites the evidence its status needs, and all
      of it exists; every cited theorem is a theorem of the built package.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/claims.yml, job: claims, step: Self-tests of the checker, runs: tools/tests/check_claims_test.py}
      - ci: {workflow: .github/workflows/claims.yml, job: claims, step: Check claims.yaml, runs: tools/check-claims}
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: Every claimed theorem is a theorem of the package, runs: tools/check-claims --theorems lean}

  # Stated and not proven.

  - id: unproven.narrower-converse
    claim: >-
      Narrower on the translation gives the model's narrower on the
      denotations. Only the other direction is proven (narrower_of_denote):
      model byte strings, argument lists and signer lists longer than
      Usize.max have no Rust counterpart.
    status: unproven
    evidence:
      - file: README.md
        contains: "narrower on the translation implies the model's narrower"

  - id: unproven.openzeppelin-signer-mapping
    claim: >-
      An OpenZeppelin context rule without policies corresponds to a rule here
      whose threshold is its number of distinct signers, and a rule with a
      simple_threshold policy of k to a threshold of k. This is read from
      OpenZeppelin's source at one commit, recorded as input for M4, and
      neither proven nor tested.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "A context rule without policies requires all of its signers."

  - id: unproven.openzeppelin-spending-limit
    claim: >-
      check_spend computes what the spending-limit policy's enforce in
      OpenZeppelin's stellar-accounts computes, at the theahaco fork commit
      Perch pins, except for the clock check, typed overflow refusals and
      purity. This is read from that source, and neither proven nor tested
      against it.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "`check_spend` follows the same steps in the same order."

  - id: unproven.openzeppelin-authorization
    claim: >-
      authorize checks what OpenZeppelin's do_check_auth checks of the rule
      choice and the spending-limit policy, at the theahaco fork commit Perch
      pins: one rule per context aligned by index, every context validated
      before any policy is enforced, and each rule's spending record charged
      in context order. This is read from that source, recorded with the
      M4 mapping notes, and neither proven nor tested against it.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "`authorize` keeps that order"

  - id: unproven.openzeppelin-spending-limit-metering
    claim: >-
      OpenZeppelin's spending-limit policy meters only transfer calls whose
      argument 2 is an i128, and refuses every other context, so a
      policy-capped OpenZeppelin rule corresponds to a rule here whose
      functions are transfer and whose cap reads argument 2; and upstream
      OpenZeppelin bounds the history at 815 entries where Perch's pin and
      rule-eval bound it at 1000. Read from source and recorded for M4.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "meters only `transfer` at argument 2"

  - id: unproven.history-bound-on-mainnet
    claim: >-
      A record of 816 or more entries does not fit in one mainnet contract-data
      entry, so on mainnet a shell's write fails before the 1000-entry bound
      refuses. This is read from upstream OpenZeppelin's source comment, and
      neither proven nor tested here.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "past mainnet's `contractDataEntrySizeBytes` of 65,536 bytes"

  - id: unproven.budget-shell
    claim: >-
      A shell charges each authorization's spend to the node of the grant
      that authorized it, stores the tree an operation returns only on Ok,
      and accepts a refill only on the owner's authority. These are the
      grant signer's duties (M6); rule-eval's budget operations take the
      node, the amount and the tree as given, and nothing here checks how a
      shell chooses them.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "Linking an authorization to a node is the shell's job"
