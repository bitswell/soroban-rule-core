      - theorem: RuleCore.RuleSet.mem_charged

  - id: authorize.refinement
    claim: >-
      From empty records, with a nonzero period and the last spend at ledger 1
      or later, the stored record of a capped rule is exactly the spends the
      run recorded for it in the window at that spend's ledger, with their sum
      as total; and it never holds more than 1000 entries.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.run_eq_window
      - theorem: RuleCore.RuleSet.run_history_length_le

  - id: authorize.trace-narrowing
    claim: >-
      Narrowing is trace inclusion: for each of the eight attenuation steps
      and every chain of them, every run of authorizations the derived rule
      set accepts from its empty records, the root accepts from its own empty
      records, with each choice renumbered by the map the steps induce
      (dropRule i moves every rule after i down by one; every other step keeps
      each index). Trace inclusion is reflexive and composes.
