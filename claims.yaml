  # Budgets on the delegation tree (formal/RuleCore/Model/Budget.lean,
  # theorems in RuleCore.Budget).

  - id: budget.spend-charges
    claim: >-
      A successful spend at a node adds the amount to the spent amount of that
      node and of every ancestor up to its root, and changes nothing else: no
      other node, no node's parent or allowance, and not the number of nodes.
      It succeeds only on a well-formed tree, at an existing node, with a
      non-negative amount and a walk that reaches the root.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_ok_charges
      - theorem: RuleCore.Budget.Tree.spend_ok_unchanged
      - theorem: RuleCore.Budget.Tree.spend_ok_length
      - theorem: RuleCore.Budget.Tree.spend_ok_parentOf
      - theorem: RuleCore.Budget.Tree.spend_ok_allowance
      - theorem: RuleCore.Budget.Tree.spend_ok_iff
      - theorem: RuleCore.Budget.Tree.mem_walk
      - theorem: RuleCore.Budget.Tree.walk_fits

  - id: budget.refusal-changes-nothing
    claim: >-
      A refused spend, delegation or refill returns no tree, and a run keeps
      the tree it had and logs no spend.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.step_of_error
      - theorem: RuleCore.Budget.Tree.run_cons_of_error
      - theorem: RuleCore.Budget.Tree.logged_of_error

  - id: budget.overdrawn-names-nearest
    claim: >-
      The node an overdrawn refusal names is on the spender's chain and cannot
      take the amount, and every node before it on the chain, counting from
      the spender, can: it is the first node that would be overdrawn, the
      target of a refill request. A node cannot take an amount when its spent
      amount plus the amount exceeds its allowance or does not fit in an
      i128.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_overdrawn
      - theorem: RuleCore.Budget.Tree.walk_overdrawn
      - theorem: RuleCore.Budget.Tree.fits_iff

  - id: budget.refuses-only-what-it-must
    claim: >-
      On a well-formed tree, a spend of a non-negative amount at an existing
      node succeeds exactly when every node on its chain can take the amount,
      and is otherwise refused as overdrawn.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_accepts_iff
      - theorem: RuleCore.Budget.Tree.spend_error_overdrawn
      - theorem: RuleCore.Budget.Tree.walk_total
      - theorem: RuleCore.Budget.Tree.walk_error

  - id: budget.delegate-and-refill
    claim: >-
      A successful delegation appends exactly a child of an existing node
      with the given non-negative allowance and nothing spent, at the next
      index, without comparing the allowance with its parent's, so children's
      allowances may sum to more than their parent's; it is refused on a tree
      of maxNodes (u32::MAX) nodes. A successful refill raises exactly one
      node's allowance by a non-negative amount whose sum fits in an i128.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.delegate_ok_iff
      - theorem: RuleCore.Budget.Tree.refill_ok_iff

  - id: budget.well-formed
    claim: >-
      A tree is well formed when every node's parent index is below its own
      and no allowance or spent amount is negative; on a well-formed tree a
      node's ancestors have smaller indices, and every successful operation,
      and so every run, keeps the tree well formed.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.valid_iff
      - theorem: RuleCore.Budget.Tree.validFrom_iff
      - theorem: RuleCore.Budget.Tree.node_valid_iff
      - theorem: RuleCore.Budget.Tree.parent_lt
      - theorem: RuleCore.Budget.Tree.nonneg_of_valid
      - theorem: RuleCore.Budget.Tree.le_of_within
      - theorem: RuleCore.Budget.Tree.within_antisymm
      - theorem: RuleCore.Budget.Tree.spend_valid
      - theorem: RuleCore.Budget.Tree.delegate_valid
      - theorem: RuleCore.Budget.Tree.refill_valid
      - theorem: RuleCore.Budget.Tree.apply_valid
      - theorem: RuleCore.Budget.Tree.step_valid
      - theorem: RuleCore.Budget.Tree.run_valid

  - id: budget.within-allowance
    claim: >-
      Every node's spent amount stays within its allowance: every operation
      and every run preserves it.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_withinAllowance
      - theorem: RuleCore.Budget.Tree.delegate_withinAllowance
      - theorem: RuleCore.Budget.Tree.refill_withinAllowance
      - theorem: RuleCore.Budget.Tree.apply_withinAllowance
      - theorem: RuleCore.Budget.Tree.step_withinAllowance
      - theorem: RuleCore.Budget.Tree.run_withinAllowance
      - theorem: RuleCore.Budget.Tree.withinAllowance_iff

  - id: budget.safety
    claim: >-
      For every run of spends, delegations and refills, each node's spent
      amount is its spent amount before the run (nothing, for a node the run
      appended) plus the total successfully spent at or under it; from a
      well-formed tree with nothing spent, the total successfully spent at or
      under any node is that node's spent amount and never exceeds its
      allowance. Nothing relates allowances to each other, so the bound holds
      however much children's allowances oversubscribe their parent's. A run
      never removes a node or changes an existing node's parent.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spentUnder_le_allowance
      - theorem: RuleCore.Budget.Tree.spentUnder_eq_spent
      - theorem: RuleCore.Budget.Tree.spent_run
      - theorem: RuleCore.Budget.Tree.step_spent
      - theorem: RuleCore.Budget.Tree.run_extends
      - theorem: RuleCore.Budget.Tree.step_extends
      - theorem: RuleCore.Budget.Tree.within_of_walk
      - theorem: RuleCore.Budget.Tree.within_root
      - theorem: RuleCore.Budget.Tree.within_step
      - theorem: RuleCore.Budget.Tree.within_trans

