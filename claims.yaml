      - theorem: RuleCore.RuleSet.Refines.authorizeAll
      - theorem: RuleCore.RuleSet.Refines.charge
      - theorem: RuleCore.RuleSet.Refines.foldlM_charge
      - theorem: RuleCore.RuleSet.RecordsRel.empty
      - theorem: RuleCore.RuleSet.attenuate_refines
      - theorem: RuleCore.RuleSet.attenuateAll_refines
      - theorem: RuleCore.RuleSet.dropRule_refines
      - theorem: RuleCore.RuleSet.modifyRule_refines
      - theorem: RuleCore.RuleSet.raiseThreshold_refines
      - theorem: RuleCore.RuleSet.addCap_refines
      - theorem: RuleCore.RuleSet.lowerCapLimit_refines
      - theorem: RuleCore.RuleSet.lengthenCapPeriod_refines
      - theorem: RuleCore.RuleSet.lowerValidUntil_refines
      - theorem: RuleCore.Rule.Refines.of_eq
      - theorem: RuleCore.RuleSet.Refines.set
      - theorem: RuleCore.RuleSet.Refines.refl
      - theorem: RuleCore.RuleSet.Refines.trans
      - theorem: RuleCore.RuleSet.TraceNarrower.refl
      - theorem: RuleCore.RuleSet.TraceNarrower.trans
