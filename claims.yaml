# The claims this repository makes, each with its status and its evidence.
#
# Status:
#   proven    a Lean theorem, checked by the kernel; evidence: theorem
#   tested    a test or a CI check run on every change; evidence: test or ci
#   measured  an observed result recorded in a file; evidence: file
#   assumed   trusted, not checked here; evidence: trusted (a TRUSTED.md heading)
#   unproven  stated, with no proof or test; evidence: where it is stated
#
# Evidence:
#   theorem: NAME              an exported theorem of the Lean package formal/
#   test: PKG/TARGET::PATH     a Rust test: workspace package, test target, test
#   ci: {workflow, job, step, runs}
#                              a step of a workflow that runs on every pull
#                              request and every push to main
#   file: PATH [contains: TEXT]
#   trusted: HEADING           a heading of TRUSTED.md
#
# `assumes` lists the assumed claims a claim rests on.
#
# tools/check-claims checks that every cited piece of evidence exists and that
# each claim cites the evidence its status needs; .github/workflows/claims.yml
# runs it.

claims:
  # The generic model (formal/RuleCore/Model, theorems in RuleCore).

  - id: model.semantics
    claim: >-
      A rule allows a context under the authenticated signers exactly when its
      scope matches, every one of its conditions holds and its signer
      requirement holds; a rule set allows a context exactly when some rule
      does; a batch is allowed exactly when every context in it is, under one
      list of authenticated signers.
    status: proven
    evidence:
      - theorem: RuleCore.Rule.allows_iff
      - theorem: RuleCore.RuleSet.allows_iff
      - theorem: RuleCore.RuleSet.allowsAll_iff

  - id: model.narrower-preorder
    claim: >-
      Narrower, which quantifies over authenticated signer lists as well as
      contexts, is reflexive and transitive.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.narrower_refl
      - theorem: RuleCore.RuleSet.narrower_trans

  - id: model.steps-narrow
    claim: >-
      Each attenuation step (drop a rule, add a condition to a rule, restrict a
      rule's scope, remove signers from a rule, raise a rule's threshold)
      yields a rule set narrower than the one it started from, under every
      list of authenticated signers.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.dropRule_narrower
      - theorem: RuleCore.RuleSet.addCond_narrower
      - theorem: RuleCore.RuleSet.restrictScope_narrower
      - theorem: RuleCore.RuleSet.removeSigners_narrower
      - theorem: RuleCore.RuleSet.raiseThreshold_narrower
      - theorem: RuleCore.RuleSet.attenuate_narrower
      - theorem: RuleCore.RuleSet.modifyRule_narrower
      - theorem: RuleCore.Rule.allows_of_allows_addCond
      - theorem: RuleCore.Rule.allows_of_allows_restrictScope
      - theorem: RuleCore.Rule.allows_of_allows_removeSigners
      - theorem: RuleCore.Rule.allows_of_allows_threshold_le
      - theorem: RuleCore.Rule.signed_of_signed_removeSigners

  - id: model.chains-stay-inside-root
    claim: >-
      Every rule set reached from a root by any chain of the five attenuation
      steps is narrower than the root.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.Derives.narrower
      - theorem: RuleCore.RuleSet.attenuateAll_derives
      - theorem: RuleCore.RuleSet.attenuateAll_narrower

  - id: model.batch-of-narrower
    claim: A narrower rule set accepts a batch only if its ancestor does.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.allowsAll_of_narrower

  - id: model.step-refusal
    claim: >-
      An attenuation step is refused with noSuchRule exactly when its rule
      position is not below the number of rules.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.dropRule_eq_error_iff
      - theorem: RuleCore.RuleSet.addCond_eq_error_iff
      - theorem: RuleCore.RuleSet.restrictScope_eq_error_iff
      - theorem: RuleCore.RuleSet.removeSigners_eq_error_iff
      - theorem: RuleCore.RuleSet.raiseThreshold_eq_noSuchRule_iff
      - theorem: RuleCore.RuleSet.modifyRule_eq_error_iff

  - id: model.threshold-lowered
    claim: >-
      raiseThreshold is refused with thresholdLowered exactly when the rule
      exists and the new threshold is below its current one.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.raiseThreshold_eq_thresholdLowered_iff

  - id: model.empty-batch
    claim: Every rule set, the empty one included, allows the empty batch.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.allowsAll_nil

  - id: model.signer-requirement
    claim: >-
      A rule's signer requirement holds exactly when at least its threshold of
      its distinct signers are among the authenticated signers; the signers
      counted are exactly the rule's signers that are authenticated, each once.
    status: proven
    evidence:
      - theorem: RuleCore.Rule.signed_iff
      - theorem: RuleCore.Rule.mem_present
      - theorem: RuleCore.Rule.nodup_present
      - theorem: RuleCore.nodup_eraseDups

  - id: model.signer-thresholds
    claim: >-
      Threshold 0 is no signer requirement; a threshold equal to the number of
      distinct signers requires every signer; a threshold above it is never
      met, so the rule allows nothing.
    status: proven
    evidence:
      - theorem: RuleCore.Rule.signed_of_threshold_zero
      - theorem: RuleCore.Rule.allows_of_threshold_zero
      - theorem: RuleCore.Rule.signed_iff_of_threshold_eq
      - theorem: RuleCore.Rule.signed_false_of_lt
      - theorem: RuleCore.Rule.allows_false_of_lt

  - id: model.signers-monotone
    claim: >-
      Authenticating more signers never turns an allow into a refusal, for a
      rule, a rule set and a batch.
    status: proven
    evidence:
      - theorem: RuleCore.Rule.signed_of_subset
      - theorem: RuleCore.Rule.allows_of_subset
      - theorem: RuleCore.RuleSet.allows_of_subset
      - theorem: RuleCore.RuleSet.allowsAll_of_subset
      - theorem: RuleCore.Rule.present_length_le_of_subset

  - id: model.signer-repeats
    claim: >-
      Repeats and order in the authenticated signers, or in a rule's own
      signer list, do not change the verdict: it depends only on which signers
      each list holds.
    status: proven
    evidence:
      - theorem: RuleCore.Rule.signed_congr
      - theorem: RuleCore.RuleSet.allows_congr
      - theorem: RuleCore.RuleSet.allowsAll_congr
      - theorem: RuleCore.RuleSet.allows_eraseDups
      - theorem: RuleCore.Rule.signed_congr_signers
      - theorem: RuleCore.Rule.allows_congr_signers
      - theorem: RuleCore.Rule.signed_eraseDups_signers
      - theorem: RuleCore.length_eq_of_nodup_of_mem_iff

  # The chain vocabulary (formal/RuleCore/Vocab, theorems in RuleCore.Chain).

  - id: chain.conds-read-their-call
    claim: >-
      A chain rule allows a call exactly when the call's contract is the
      rule's contract, its function is in the rule's function list, every
      condition of the rule holds on that call's own arguments, and at least
      its threshold of its distinct signers are authenticated.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.Rule.allows_call_iff
      - theorem: RuleCore.Chain.Rule.signed_iff
      - theorem: RuleCore.Chain.Rule.allows_iff
      - theorem: RuleCore.Chain.RuleSet.allows_iff
      - theorem: RuleCore.Chain.RuleSet.allowsAll_iff

  - id: chain.conditions
    claim: >-
      argEq index v holds exactly when argument index exists and equals v;
      argI128AtMost index n holds exactly when argument index exists, is an
      i128 and is at most n as a signed integer; a missing argument makes
      either condition false.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.Cond.argEq_holds_iff
      - theorem: RuleCore.Chain.Cond.argI128AtMost_holds_iff
      - theorem: RuleCore.Chain.Cond.holds_false_of_length_le

  - id: chain.steps-narrow
    claim: >-
      Each chain attenuation step (dropRule, addCond, removeFunctions,
      removeSigners, raiseThreshold) yields a narrower rule set, and each
      denotes the generic step of the same kind.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.RuleSet.dropRule_narrower
      - theorem: RuleCore.Chain.RuleSet.addCond_narrower
      - theorem: RuleCore.Chain.RuleSet.removeFunctions_narrower
      - theorem: RuleCore.Chain.RuleSet.removeSigners_narrower
      - theorem: RuleCore.Chain.RuleSet.raiseThreshold_narrower
      - theorem: RuleCore.Chain.RuleSet.attenuate_narrower
      - theorem: RuleCore.Chain.RuleSet.denote_dropRule
      - theorem: RuleCore.Chain.RuleSet.denote_addCond
      - theorem: RuleCore.Chain.RuleSet.denote_removeFunctions
      - theorem: RuleCore.Chain.RuleSet.denote_removeSigners
      - theorem: RuleCore.Chain.RuleSet.denote_raiseThreshold
      - theorem: RuleCore.Chain.RuleSet.denote_attenuate
      - theorem: RuleCore.Chain.RuleSet.denote_modifyRule
      - theorem: RuleCore.Chain.Rule.denote_addCond
      - theorem: RuleCore.Chain.Rule.denote_removeFunctions
      - theorem: RuleCore.Chain.Rule.denote_removeSigners
      - theorem: RuleCore.Chain.Rule.mem_removeFunctions
      - theorem: RuleCore.Chain.Rule.mem_removeSigners
      - theorem: RuleCore.Chain.RuleSet.rules_denote

  - id: chain.narrower-preorder
    claim: Chain narrower is reflexive and transitive.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.RuleSet.narrower_refl
      - theorem: RuleCore.Chain.RuleSet.narrower_trans

  - id: chain.chains-stay-inside-root
    claim: >-
      Every chain rule set reached from a root by any chain of attenuation
      steps is narrower than the root.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.RuleSet.Derives.narrower
      - theorem: RuleCore.Chain.RuleSet.attenuateAll_derives
      - theorem: RuleCore.Chain.RuleSet.attenuateAll_narrower

  - id: chain.batch-of-narrower
    claim: A narrower chain rule set accepts a batch only if its ancestor does.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.RuleSet.allowsAll_of_narrower

  - id: chain.step-refusal
    claim: >-
      A chain attenuation step is refused with noSuchRule exactly when its
      UInt32 index is not below the number of rules.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.RuleSet.dropRule_eq_error_iff
      - theorem: RuleCore.Chain.RuleSet.addCond_eq_error_iff
      - theorem: RuleCore.Chain.RuleSet.removeFunctions_eq_error_iff
      - theorem: RuleCore.Chain.RuleSet.removeSigners_eq_error_iff
      - theorem: RuleCore.Chain.RuleSet.raiseThreshold_eq_noSuchRule_iff
      - theorem: RuleCore.Chain.RuleSet.modifyRule_eq_error_iff

  - id: chain.threshold-lowered
    claim: >-
      The chain raiseThreshold is refused with thresholdLowered exactly when
      the rule exists and the new UInt32 threshold is below its current one.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.RuleSet.raiseThreshold_eq_thresholdLowered_iff

  - id: chain.no-creation
    claim: >-
      No chain rule allows a contract creation, so no chain rule set does, and
      a batch containing a creation is denied.
    status: proven
    assumes: [rule.no-creation-vocabulary]
    evidence:
      - theorem: RuleCore.Chain.Rule.allows_create
      - theorem: RuleCore.Chain.RuleSet.allows_create
      - theorem: RuleCore.Chain.RuleSet.allowsAll_false_of_create_mem

  - id: chain.argeq-same-constructor
    claim: >-
      argEq holds only for an argument of the same constructor as its value;
      values of different constructors are never equal, and an other value
      never equals a bytes value whatever its bytes.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.Cond.argEq_kind
      - theorem: RuleCore.Chain.Cond.argEq_false_of_kind_ne
      - theorem: RuleCore.Chain.Cond.argEq_bytes_false_of_other
      - theorem: RuleCore.Chain.Val.ne_of_kind_ne

  - id: chain.bytes-exact
    claim: >-
      Byte strings compare exactly (equal length and equal bytes): a rule
      allows a call only to its own contract id, and never to a proper prefix
      or a proper extension of it.
    status: proven
    evidence:
      - theorem: RuleCore.Bytes.eq_iff
      - theorem: RuleCore.Bytes.append_ne_self
      - theorem: RuleCore.Chain.Rule.contract_eq_of_allows
      - theorem: RuleCore.Chain.Rule.allows_prefix_false
      - theorem: RuleCore.Chain.Rule.allows_extension_false

  - id: chain.signers-exact
    claim: >-
      Signers compare exactly, constructor first: a delegated signer never
      equals an external one, whatever their bytes; signers of one kind are
      equal exactly when their bytes are, with no prefix or extension match;
      a rule signer counts only when exactly that signer is authenticated.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.Signer.delegated_ne_external
      - theorem: RuleCore.Chain.Signer.delegated_eq_iff
      - theorem: RuleCore.Chain.Signer.external_eq_iff
      - theorem: RuleCore.Chain.Signer.delegated_append_ne
      - theorem: RuleCore.Chain.Rule.mem_present

  - id: chain.signer-thresholds
    claim: >-
      For chain rules, threshold 0 makes the verdict independent of the
      authenticated signers; a threshold equal to the number of distinct
      signers requires every signer; a threshold above it allows nothing.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.Rule.signed_of_threshold_zero
      - theorem: RuleCore.Chain.Rule.allows_of_threshold_zero
      - theorem: RuleCore.Chain.Rule.signed_iff_of_threshold_eq
      - theorem: RuleCore.Chain.Rule.allows_false_of_lt

  - id: chain.signers-monotone
    claim: >-
      Authenticating more signers never turns a chain allow into a refusal,
      for a rule, a rule set and a batch.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.Rule.allows_of_subset
      - theorem: RuleCore.Chain.RuleSet.allows_of_subset
      - theorem: RuleCore.Chain.RuleSet.allowsAll_of_subset

  - id: chain.signer-repeats
    claim: >-
      Repeats and order in the authenticated signers, or in a chain rule's
      signer list, do not change the verdict.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.RuleSet.allows_congr
      - theorem: RuleCore.Chain.RuleSet.allowsAll_congr
      - theorem: RuleCore.Chain.RuleSet.allows_eraseDups
      - theorem: RuleCore.Chain.Rule.allows_congr_signers
      - theorem: RuleCore.Chain.Rule.allows_eraseDups_signers

  - id: chain.empty-function-list
    claim: A rule with an empty function list allows nothing.
    status: proven
    evidence:
      - theorem: RuleCore.Chain.Rule.allows_false_of_functions_nil

  - id: chain.examples
    claim: >-
      Seventeen concrete verdicts of the chain vocabulary are checked by the
      kernel on every build: a capped transfer at, over and below its cap,
      with an amount of another constructor and with no amount; a prefix of
      the contract id; a batch holding a creation; an argument index of
      2^32 - 1; a rule with its only function removed; an out-of-range rule
      index; two of three distinct signers; a signer authenticated twice; a
      signer listed twice; an external signer holding a delegated signer's
      bytes; a threshold above the signers; a lowered threshold refused; a
      signer removed with the threshold kept.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: lake build, runs: lake build}
      - file: formal/RuleCore/Theorems/Examples.lean

  # Spending caps (formal/RuleCore/Model/Cap.lean, theorems in RuleCore.Cap).

  - id: cap.check
    claim: >-
      The cap check refuses a negative amount, passes a zero amount with the
      record unchanged whatever its total, and on a valid record keeps the
      entries after the cutoff now - period and refuses with overflow,
      limitExceeded or historyFull exactly when the kept total plus the amount
      does not fit in an i128, exceeds the limit, or the kept entries number
      1000; eviction only ever refuses with overflow.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.check_negative
      - theorem: RuleCore.Cap.check_zero
      - theorem: RuleCore.Cap.check_valid
      - theorem: RuleCore.Cap.check_pos_ok
      - theorem: RuleCore.Cap.evict_eq
      - theorem: RuleCore.Cap.evict_error
      - theorem: RuleCore.Cap.dropWhile_eq_filter

  - id: cap.clock-check
    claim: >-
      A positive spend is refused with ledgerBeforeNewest exactly when the
      current ledger is earlier than the ledger of the newest recorded entry;
      on a history in ledger order, exactly when some entry is after it.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.check_ledgerBeforeNewest_iff
      - theorem: RuleCore.Cap.beforeNewest_eq_false_iff

  - id: cap.refusal-changes-nothing
    claim: >-
      A refused call leaves the record as it was, and changes nothing in the
      rest of a run.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.step_of_error
      - theorem: RuleCore.Cap.run_cons_of_error

  - id: cap.valid
    claim: >-
      The empty record is valid, and the check keeps a record valid: its
      history in ledger order, its amounts positive, its total their sum and
      within an i128.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.Record.empty_valid
      - theorem: RuleCore.Cap.check_preserves_valid
      - theorem: RuleCore.Cap.run_valid

  - id: cap.window-safety
    claim: >-
      For every run from the empty record and every ledger t, the recorded
      spends in the window eviction leaves at t (ledger after t - period and
      at most t) sum to at most the limit. No assumption is made about the
      ledgers of the calls. From any valid record, every window holding a
      spend the run recorded sums to at most the limit, so a cap installed
      over an existing record bounds every window holding a spend made under
      it.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.window_le_limit
      - theorem: RuleCore.Cap.window_le_limit_of_valid
      - theorem: RuleCore.Cap.run_spec
      - theorem: RuleCore.Cap.RunInv.start
      - theorem: RuleCore.Cap.RunInv.step_pos

  - id: cap.consecutive-windows
    claim: >-
      Every window of period consecutive ledgers starting at ledger 1 or
      later holds recorded spends summing to at most the limit; when every
      call is at ledger 1 or later, every window does.
    status: proven
    assumes: [rule.ledgers-start-at-1]
    evidence:
      - theorem: RuleCore.Cap.period_le_limit_of_pos
      - theorem: RuleCore.Cap.period_le_limit
      - theorem: RuleCore.Cap.inPeriodFrom_eq_inWindow

  - id: cap.ledger-zero
    claim: >-
      Without calls at ledger 1 or later the consecutive-window statement is
      false: under a valid cap, two spends of the whole limit at ledger 0 are
      both recorded, because the cutoff saturates to 0 and evicts entries at
      ledger 0.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.period_ledger_zero

  - id: cap.refinement
    claim: >-
      After a run, the stored history is the recorded spends eviction left at
      the last recorded spend's ledger followed by that spend, and the stored
      total is their sum; with a nonzero period and that spend at ledger 1 or
      later, the history is exactly the recorded spends in the window at its
      ledger. A run that records nothing leaves the record as it was.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.run_history
      - theorem: RuleCore.Cap.run_total
      - theorem: RuleCore.Cap.run_eq_window
      - theorem: RuleCore.Cap.run_eq_of_recorded_nil
      - theorem: RuleCore.Cap.mem_recorded

  - id: cap.history-bound
    claim: A record never holds more than 1000 entries.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.run_history_length_le

  - id: cap.narrowing
    claim: >-
      Narrowing a cap is trace inclusion: every run a narrower cap (a lower
      limit, a longer period, or a cap where there was none) accepts from a
      valid record, the wider one accepts. Narrower on caps is reflexive and
      transitive.
    status: proven
    evidence:
      - theorem: RuleCore.Cap.Params.accepts_of_narrower
      - theorem: RuleCore.Cap.accepts_of_limit_le
      - theorem: RuleCore.Cap.accepts_of_period_le
      - theorem: RuleCore.Cap.capAccepts_of_capNarrower
      - theorem: RuleCore.Cap.accepts_of_narrower_suffix
      - theorem: RuleCore.Cap.filter_cutoff_suffix
      - theorem: RuleCore.Cap.Params.narrower_refl
      - theorem: RuleCore.Cap.Params.narrower_trans

  # The translation of crates/rule-eval (formal/RuleCore/Extracted) and its
  # equivalence to the chain vocabulary (formal/RuleCore/Equiv).

  - id: equiv.evaluation
    claim: >-
      On every input, the translated allows and allows_all return ok of the
      chain model's allows and allowsAll on the denotations, authenticated
      signers included; since ok excludes divergence and failure, they
      terminate and never panic. The same holds for rule_allows, conds_hold,
      cond_holds, val_eq, bytes_eq, bytes_in, signers_met, signed_count,
      signer_eq, signer_in and signer_in_first.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel, trusted.denotations]
    evidence:
      - theorem: RuleCore.Equiv.allows_eq
      - theorem: RuleCore.Equiv.allows_all_eq
      - theorem: RuleCore.Equiv.rule_allows_eq
      - theorem: RuleCore.Equiv.conds_hold_eq
      - theorem: RuleCore.Equiv.cond_holds_eq
      - theorem: RuleCore.Equiv.val_eq_eq
      - theorem: RuleCore.Equiv.bytes_eq_eq
      - theorem: RuleCore.Equiv.bytes_in_eq
      - theorem: RuleCore.Equiv.signers_met_eq
      - theorem: RuleCore.Equiv.signed_count_eq
      - theorem: RuleCore.Equiv.signer_eq_eq
      - theorem: RuleCore.Equiv.signer_in_eq
      - theorem: RuleCore.Equiv.signer_in_first_eq
      - theorem: RuleCore.Equiv.any_signer_eq_mem

  - id: equiv.attenuation
    claim: >-
      On every input, the translated drop_rule, remove_functions,
      remove_signers and raise_threshold return ok of a result that denotes
      the chain model's step on the denotations, noSuchRule and
      thresholdLowered included; add_cond does the same whenever the rule at
      its index has room for one more condition (CondRoom), and fails when it
      does not, so CondRoom is exact.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel, trusted.denotations, rule.cond-room]
    evidence:
      - theorem: RuleCore.Equiv.drop_rule_eq
      - theorem: RuleCore.Equiv.remove_functions_eq
      - theorem: RuleCore.Equiv.add_cond_eq
      - theorem: RuleCore.Equiv.add_cond_full
      - theorem: RuleCore.Equiv.drop_rule_ok
      - theorem: RuleCore.Equiv.drop_rule_err
      - theorem: RuleCore.Equiv.remove_functions_ok
      - theorem: RuleCore.Equiv.remove_functions_err
      - theorem: RuleCore.Equiv.add_cond_ok
      - theorem: RuleCore.Equiv.add_cond_err
      - theorem: RuleCore.Equiv.bytes_list_without_eq
      - theorem: RuleCore.Equiv.rule_without_functions_eq
      - theorem: RuleCore.Equiv.remove_signers_eq
      - theorem: RuleCore.Equiv.remove_signers_ok
      - theorem: RuleCore.Equiv.remove_signers_err
      - theorem: RuleCore.Equiv.raise_threshold_eq
      - theorem: RuleCore.Equiv.raise_threshold_ok
      - theorem: RuleCore.Equiv.raise_threshold_err
      - theorem: RuleCore.Equiv.raise_threshold_lowered
      - theorem: RuleCore.Equiv.signers_without_eq
      - theorem: RuleCore.Equiv.rule_without_signers_eq
      - theorem: RuleCore.Equiv.denote_filter_inList
      - theorem: RuleCore.Equiv.denote_filter_signerInList

  - id: equiv.copies
    claim: Every translated copy (bytes, byte lists, values, conditions, signers, rules) returns ok of its input.
    status: proven
    evidence:
      - theorem: RuleCore.Equiv.bytes_copy_eq
      - theorem: RuleCore.Equiv.bytes_copy_deref
      - theorem: RuleCore.Equiv.bytes_list_copy_deref
      - theorem: RuleCore.Equiv.val_copy_eq
      - theorem: RuleCore.Equiv.cond_copy_eq
      - theorem: RuleCore.Equiv.conds_copy_deref
      - theorem: RuleCore.Equiv.signer_copy_eq
      - theorem: RuleCore.Equiv.signers_copy_deref
      - theorem: RuleCore.Equiv.rule_copy_eq

  - id: equiv.denotations-injective
    claim: Every denotation from the translated types to the chain vocabulary is injective.
    status: proven
    evidence:
      - theorem: RuleCore.Equiv.denoteBytes_injective
      - theorem: RuleCore.Equiv.denoteU32_injective
      - theorem: RuleCore.Equiv.denoteU64_injective
      - theorem: RuleCore.Equiv.denoteVal_injective
      - theorem: RuleCore.Equiv.denoteContext_injective
      - theorem: RuleCore.Equiv.denoteCond_injective
      - theorem: RuleCore.Equiv.denoteSigner_injective
      - theorem: RuleCore.Equiv.denoteSigners_injective
      - theorem: RuleCore.Equiv.denoteRule_injective
      - theorem: RuleCore.Equiv.denoteRules_injective
      - theorem: RuleCore.Equiv.denoteError_injective
      - theorem: RuleCore.Equiv.denoteOutcome_injective

  - id: equiv.loops
    claim: >-
      What each of the four loop shapes returns follows from one round of its
      body; counting each element at its first position counts the elements
      of eraseDups; Vec::push succeeds below Usize.max elements and fails at
      it; the loop counter's and the signer count's increments and in-range
      indexing succeed; get is the list lookup.
    status: proven
    evidence:
      - theorem: RuleCore.Equiv.loop_any
      - theorem: RuleCore.Equiv.loop_all
      - theorem: RuleCore.Equiv.loop_build
      - theorem: RuleCore.Equiv.loop_build_fail
      - theorem: RuleCore.Equiv.loop_count
      - theorem: RuleCore.Equiv.countFrom_first
      - theorem: RuleCore.Equiv.countFrom_first_from
      - theorem: RuleCore.Equiv.countFrom_map
      - theorem: RuleCore.Equiv.push_eq
      - theorem: RuleCore.Equiv.push_full
      - theorem: RuleCore.Equiv.incr_eq
      - theorem: RuleCore.Equiv.incr_eq_of_le
      - theorem: RuleCore.Equiv.index_usize_eq
      - theorem: RuleCore.Equiv.slice_get_eq

  - id: equiv.caps
    claim: >-
      On every input, the translated check_spend returns ok of the cap model's
      check on the denotations, so it terminates and never panics, with no
      stated bound; the same holds for params_valid, empty_record,
      before_newest, the eviction loop, entries_from and record_copy, and the
      library's checked_add, checked_sub and saturating_sub agree with the
      model's arithmetic.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel, trusted.denotations]
    evidence:
      - theorem: RuleCore.Equiv.check_spend_eq
      - theorem: RuleCore.Equiv.params_valid_eq
      - theorem: RuleCore.Equiv.empty_record_eq
      - theorem: RuleCore.Equiv.before_newest_eq
      - theorem: RuleCore.Equiv.evict_loop_eq
      - theorem: RuleCore.Equiv.entries_from_eq
      - theorem: RuleCore.Equiv.record_copy_eq
      - theorem: RuleCore.Equiv.checked_add_eq
      - theorem: RuleCore.Equiv.checked_sub_eq
      - theorem: RuleCore.Equiv.saturating_sub_val

  - id: equiv.cap-denotations-injective
    claim: >-
      The denotations of the cap types (entries, records, parameters, errors
      and check_spend's result) are injective.
    status: proven
    evidence:
      - theorem: RuleCore.Equiv.denoteEntry_injective
      - theorem: RuleCore.Equiv.denoteRecord_injective
      - theorem: RuleCore.Equiv.denoteParams_injective
      - theorem: RuleCore.Equiv.denoteCapError_injective
      - theorem: RuleCore.Equiv.denoteSpend_injective

  # The model's theorems carried over to the translation, stated on the
  # translated functions alone (formal/RuleCore/Theorems/Extracted.lean).

  - id: extracted.steps-narrow
    claim: >-
      Each translated attenuation step that returns Ok yields a narrower rule
      set; an add_cond that returned Ok had room for its condition.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.drop_rule_narrower
      - theorem: RuleCore.Extracted.add_cond_narrower
      - theorem: RuleCore.Extracted.remove_functions_narrower
      - theorem: RuleCore.Extracted.remove_signers_narrower
      - theorem: RuleCore.Extracted.raise_threshold_narrower
      - theorem: RuleCore.Extracted.Step.narrower
      - theorem: RuleCore.Extracted.add_cond_room

  - id: extracted.chains-stay-inside-root
    claim: >-
      Narrower on the translation is reflexive and transitive, and any chain
      of translated steps stays inside its root.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.Narrower.refl
      - theorem: RuleCore.Extracted.Narrower.trans
      - theorem: RuleCore.Extracted.Derives.narrower

  - id: extracted.batch-of-narrower
    claim: >-
      A narrower rule set's translated allows_all accepts a batch only if its
      ancestor's does, for one step or a chain of steps.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.allows_all_of_narrower
      - theorem: RuleCore.Extracted.Derives.allows_all

  - id: extracted.narrower-of-denote
    claim: The model's narrower on the denotations gives narrower on the translation.
    status: proven
    assumes: [trusted.denotations]
    evidence:
      - theorem: RuleCore.Extracted.narrower_of_denote

  - id: extracted.no-creation
    claim: >-
      The translated allows denies every contract creation, and allows_all
      denies every batch containing one.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.allows_create
      - theorem: RuleCore.Extracted.allows_all_create

  - id: extracted.argeq-same-constructor
    claim: >-
      The translated val_eq returns true exactly on equal values, so only on
      values of one constructor, and an Other value never equals a Bytes
      value; ArgEq index v holds exactly when argument index exists and is v.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.val_eq_iff
      - theorem: RuleCore.Extracted.val_eq_kind
      - theorem: RuleCore.Extracted.val_eq_other_bytes
      - theorem: RuleCore.Extracted.cond_holds_argEq_iff
      - theorem: RuleCore.Extracted.cond_holds_argEq_kind
      - theorem: RuleCore.Extracted.cond_holds_argEq_false_of_kind_ne

  - id: extracted.bytes-exact
    claim: >-
      The translated bytes_eq returns true exactly on equal byte strings; a
      translated rule allows a call only to its own contract and listed
      functions, and never to a proper prefix or extension of its contract id.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.bytes_eq_iff
      - theorem: RuleCore.Extracted.rule_allows_call
      - theorem: RuleCore.Extracted.rule_allows_prefix_false
      - theorem: RuleCore.Extracted.rule_allows_extension_false

  - id: extracted.signers-exact
    claim: >-
      The translated signer_eq returns true exactly on equal signers, so a
      Delegated signer never equals an External one, whatever their bytes.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.signer_eq_iff
      - theorem: RuleCore.Extracted.signer_eq_delegated_external

  - id: extracted.signers-monotone
    claim: >-
      Authenticating more signers never turns the translated allows or
      allows_all from true to false.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.allows_of_subset
      - theorem: RuleCore.Extracted.allows_all_of_subset
      - theorem: RuleCore.Extracted.denoteSigners_subset

  - id: extracted.signer-repeats
    claim: >-
      Repeats and order in the authenticated signers, or in a translated
      rule's signer vector, do not change the translated verdict.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel]
    evidence:
      - theorem: RuleCore.Extracted.allows_congr
      - theorem: RuleCore.Extracted.allows_all_congr
      - theorem: RuleCore.Extracted.rule_allows_congr_signers
      - theorem: RuleCore.Extracted.denoteSigners_mem_iff

  - id: extracted.signer-thresholds
    claim: >-
      With threshold 0 the translated rule_allows does not depend on the
      authenticated signers; the translated signers_met with a threshold equal
      to the number of distinct signers holds exactly when every signer is
      authenticated; with a threshold above that number rule_allows returns
      false.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel, trusted.denotations]
    evidence:
      - theorem: RuleCore.Extracted.rule_allows_threshold_zero
      - theorem: RuleCore.Extracted.signers_met_all_iff
      - theorem: RuleCore.Extracted.rule_allows_false_of_lt

  - id: extracted.caps
    claim: >-
      A run of the translated check_spend, keeping the record after a
      refusal, returns ok of a record denoting the model's run; from the
      empty record that record holds at most MAX_HISTORY_ENTRIES entries and,
      with a nonzero period and the last recorded spend at ledger 1 or later,
      denotes exactly the recorded spends in its window with their sum as
      total. The translated check refuses a negative amount, returns the
      record unchanged on a zero amount, and refuses a positive spend before
      the newest recorded ledger.
    status: proven
    assumes: [trusted.rustc, trusted.charon, trusted.aeneas, trusted.aeneas-result-loop, trusted.aeneas-library-items, trusted.lean-kernel, trusted.denotations]
    evidence:
      - theorem: RuleCore.Extracted.runSpends_eq
      - theorem: RuleCore.Extracted.runSpends_window
      - theorem: RuleCore.Extracted.runSpends_length_le
      - theorem: RuleCore.Extracted.empty_record_denote
      - theorem: RuleCore.Extracted.check_spend_negative
      - theorem: RuleCore.Extracted.check_spend_zero
      - theorem: RuleCore.Extracted.check_spend_before_newest

  # Stated rules: what the theorems take as given about their callers.

  - id: rule.cond-room
    claim: >-
      CondRoom: the rule add_cond extends holds fewer than Usize.max
      conditions. A Rust Vec<Cond> never reaches that length.
    status: assumed
    evidence:
      - trusted: CondRoom

  - id: rule.empty-batch
    claim: >-
      Callers never hand the evaluator an empty batch as an authorization: a
      batch collected from a Soroban authorization tree always holds its root
      context, and a caller that builds batches another way rejects the empty
      batch itself.
    status: assumed
    evidence:
      - trusted: The empty batch

  - id: rule.no-creation-vocabulary
    claim: >-
      Rule sets are chain-vocabulary rule sets, whose every scope is false on
      a creation; the generic model, whose scopes are arbitrary predicates,
      makes no no-creation claim.
    status: assumed
    evidence:
      - trusted: No creation is a vocabulary property

  - id: rule.ledgers-start-at-1
    claim: >-
      Every call of the cap check is made at ledger 1 or later: Stellar's
      genesis ledger has sequence 1 and contracts run in later ledgers.
    status: assumed
    evidence:
      - trusted: Ledgers start at 1

  # Trusted: what the proofs rest on and nothing here checks.

  - id: trusted.rustc
    claim: >-
      rustc compiles crates/rule-eval to code that behaves as the MIR Charon
      reads from the pinned nightly, for the native and wasm32v1-none targets
      and on the stable release CI also builds with.
    status: assumed
    evidence:
      - trusted: rustc

  - id: trusted.charon
    claim: Charon translates the crate's MIR to LLBC faithfully.
    status: assumed
    evidence:
      - trusted: Charon

  - id: trusted.aeneas
    claim: Aeneas translates the LLBC to Lean faithfully.
    status: assumed
    evidence:
      - trusted: Aeneas

  - id: trusted.aeneas-result-loop
    claim: >-
      Aeneas's Result monad and loop combinator model Rust's panics and loops:
      fail is a panic, div is divergence.
    status: assumed
    evidence:
      - trusted: Result and loop

  - id: trusted.aeneas-library-items
    claim: >-
      Aeneas's Lean models of the Rust library items the evaluator calls match
      those items' behaviour.
    status: assumed
    evidence:
      - trusted: Rust library items the evaluator calls

  - id: trusted.lean-kernel
    claim: Lean's kernel checks proofs correctly.
    status: assumed
    evidence:
      - trusted: Lean's kernel

  - id: trusted.denotations
    claim: >-
      The denotation functions from the translated types to the chain
      vocabulary and to the cap model say what the Rust types mean; they are
      part of the specification.
    status: assumed
    evidence:
      - trusted: The denotation functions

  # Tests of crates/rule-eval.

  - id: tested.evaluation
    claim: >-
      Over small universes (9 values covering every constructor, 335
      contexts, every rule set of up to two rules), allows agrees with an
      ordinary-Rust reading of the semantics, allows_all is the conjunction of
      allows, and no rule set allows a creation; unit tests cover every
      constructor, both conditions, missing and out-of-range indices and exact
      byte comparison.
    status: tested
    evidence:
      - test: rule-eval/evaluate::allows_agrees_with_the_reference_reading
      - test: rule-eval/evaluate::allows_all_is_the_conjunction_of_allows
      - test: rule-eval/evaluate::allows_all_on_empty_batches_and_empty_rule_sets
      - test: rule-eval/evaluate::no_rule_allows_a_creation
      - test: rule-eval/evaluate::a_cap_reads_only_the_call_its_rule_matches
      - test: rule-eval/evaluate::a_rule_matches_its_contract_and_functions_exactly
      - test: rule-eval/evaluate::a_rule_needs_every_condition
      - test: rule-eval/evaluate::a_rule_set_allows_when_some_rule_does
      - test: rule-eval/evaluate::a_rule_without_functions_allows_nothing
      - test: rule-eval/evaluate::arg_eq_needs_the_argument_and_the_same_value
      - test: rule-eval/evaluate::arg_eq_on_every_constructor
      - test: rule-eval/evaluate::arg_i128_at_most_needs_an_i128_within_the_bound
      - test: rule-eval/evaluate::bytes_compare_exactly
      - test: rule-eval/evaluate::bytes_in_needs_an_exact_member
      - test: rule-eval/evaluate::every_constructor_equals_itself_and_compares_its_payload
      - test: rule-eval/evaluate::out_of_range_condition_indices_are_false
      - test: rule-eval/evaluate::values_equal_only_with_the_same_constructor

  - id: tested.signers
    claim: >-
      Over a universe of five signers of both kinds (equal bytes across kinds,
      an address extending another), every signer list of up to three
      signers, thresholds 0 to 4 and 63 authenticated lists, signers_met
      agrees with an ordinary-Rust reading of the requirement, authenticating
      more signers never refuses, and order and repeats in the authenticated
      list change nothing; unit tests cover exact signer comparison, each
      threshold case, repeats in either list, delegated versus external
      signers with equal bytes, missing signers and one authenticated list per
      batch.
    status: tested
    evidence:
      - test: rule-eval/signers::signers_met_agrees_with_the_reference_reading
      - test: rule-eval/signers::authenticating_more_signers_never_refuses
      - test: rule-eval/signers::the_same_authenticated_signers_in_another_order_or_repeated_give_the_same_verdict
      - test: rule-eval/signers::allows_agrees_with_the_reference_reading_under_signers
      - test: rule-eval/signers::signers_compare_exactly
      - test: rule-eval/signers::signer_in_needs_an_exact_member
      - test: rule-eval/signers::threshold_zero_needs_no_signer
      - test: rule-eval/signers::thresholds_count_distinct_authenticated_signers
      - test: rule-eval/signers::repeats_in_either_list_count_once
      - test: rule-eval/signers::delegated_and_external_with_equal_bytes_are_different_signers
      - test: rule-eval/signers::missing_signers_refuse_only_the_rule_that_needs_them
      - test: rule-eval/signers::the_batch_shares_one_authenticated_list

  - id: tested.attenuation
    claim: >-
      Every attenuation step builds the expected rule set and only narrows,
      on every rule set of up to two rules, and every step on rules with
      signers only narrows under every authenticated list; every chain of two
      steps stays inside its root; out-of-range indices are refused, and a
      lowered threshold is refused.
    status: tested
    evidence:
      - test: rule-eval/attenuate::every_step_builds_its_result_and_only_narrows
      - test: rule-eval/attenuate::every_two_step_chain_stays_inside_its_root
      - test: rule-eval/attenuate::out_of_range_indices_are_refused
      - test: rule-eval/attenuate::drop_rule_removes_exactly_that_rule
      - test: rule-eval/attenuate::add_cond_appends_to_that_rule_only
      - test: rule-eval/attenuate::adding_a_cap_denies_what_it_excludes
      - test: rule-eval/attenuate::remove_functions_removes_from_that_rule_only
      - test: rule-eval/attenuate::remove_functions_matches_names_exactly_and_removes_duplicates
      - test: rule-eval/attenuate::remove_signers_removes_every_occurrence_from_that_rule_only
      - test: rule-eval/attenuate::raise_threshold_sets_that_rule_and_refuses_to_lower
      - test: rule-eval/attenuate::signer_steps_only_narrow_under_every_authenticated_list

  - id: tested.caps
    claim: >-
      check_spend agrees with a plain Rust reading of the check on every run
      of up to three calls drawn from 25 calls under 16 small caps, and every
      such run keeps every window within the limit and its total equal to its
      history's sum; unit tests cover each refusal and its precedence,
      eviction at and beside the cutoff, the cutoff at ledger 0 and at
      u32::MAX, the history bound and each checked sum.
    status: tested
    evidence:
      - test: rule-eval/caps::check_spend_agrees_with_the_reference_reading
      - test: rule-eval/caps::every_short_run_stays_within_every_window
      - test: rule-eval/caps::params_need_a_positive_limit_and_a_nonzero_period
      - test: rule-eval/caps::the_empty_record_holds_nothing
      - test: rule-eval/caps::a_negative_amount_is_refused
      - test: rule-eval/caps::a_zero_amount_passes_and_changes_nothing
      - test: rule-eval/caps::a_spend_within_the_limit_is_appended
      - test: rule-eval/caps::the_limit_is_inclusive
      - test: rule-eval/caps::eviction_drops_entries_at_or_before_the_cutoff
      - test: rule-eval/caps::a_refusal_does_not_keep_the_eviction
      - test: rule-eval/caps::eviction_stops_at_the_first_entry_after_the_cutoff
      - test: rule-eval/caps::the_cutoff_saturates_at_ledger_zero
      - test: rule-eval/caps::a_spend_before_the_newest_entry_is_refused
      - test: rule-eval/caps::the_history_holds_at_most_max_entries
      - test: rule-eval/caps::sums_that_overflow_are_refused

  # Conformance vectors (conformance/).

  - id: conformance.from-model
    claim: >-
      The committed vectors in conformance/vectors and cap traces in
      conformance/vectors/caps are exactly what the Lean model computes:
      regenerating them into an empty directory gives no difference.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/conformance.yml, job: regenerate, step: Regenerate the vectors and compare, runs: diff -r conformance/vectors}
      - file: conformance/vectors

  - id: conformance.rule-eval-agrees
    claim: >-
      rule-eval returns every verdict and attenuation result of every vector;
      the vectors cover every value constructor, condition, signer kind,
      repeated signers, each threshold case, step kind and outcome; a vector
      with a changed expectation is reported.
    status: tested
    evidence:
      - test: rule-eval-conformance/vectors::rule_eval_agrees_with_every_vector
      - test: rule-eval-conformance/vectors::vectors_cover_every_kind
      - test: rule-eval-conformance/vectors::a_wrong_expectation_is_reported
      - test: rule-eval-conformance/vectors::hex_is_lowercase_and_even
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: cargo test, runs: cargo test --workspace}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: cargo test, runs: test --workspace}

  - id: conformance.caps-agree
    claim: >-
      rule-eval's check_spend reproduces every outcome and record of every cap
      trace; the traces cover every refusal, accepted spends, zero amounts,
      ledger 0, u32::MAX ledgers and periods, non-empty starting records and
      caps that are not valid to install; a trace with a changed expectation
      is reported.
    status: tested
    evidence:
      - test: rule-eval-conformance/caps::rule_eval_agrees_with_every_cap_trace
      - test: rule-eval-conformance/caps::cap_traces_cover_every_outcome
      - test: rule-eval-conformance/caps::a_wrong_cap_expectation_is_reported
      - file: conformance/vectors/caps

  - id: conformance.encoding
    claim: >-
      The generator's JSON encoding of the model's values and the runner's
      decoding into rule-eval's types are faithful.
    status: unproven
    evidence:
      - trusted: The conformance encoding

  # The restricted subset and the build.

  - id: build.no-std-no-unsafe
    claim: rule-eval is no_std, forbids unsafe code and has no dependencies.
    status: tested
    evidence:
      - file: crates/rule-eval/src/lib.rs
        contains: "#![no_std]"
      - file: crates/rule-eval/src/lib.rs
        contains: "#![forbid(unsafe_code)]"
      - file: crates/rule-eval/Cargo.toml
        contains: "[dependencies]\n"
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (release), runs: --target wasm32v1-none}

  - id: build.overflow-checks
    claim: Arithmetic overflow traps in the release and contract profiles.
    status: tested
    evidence:
      - file: Cargo.toml
        contains: "[profile.release]\noverflow-checks = true"
      - file: Cargo.toml
        contains: "[profile.contract]\ninherits = \"release\"\nopt-level = \"z\"\noverflow-checks = true"
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build native (release), runs: --release}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (contract profile), runs: --profile contract}

  - id: build.targets
    claim: >-
      rule-eval builds for native and for wasm32v1-none, in release and in the
      contract profile, on the pinned nightly and on stable.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build native (release), runs: cargo build -p rule-eval --release}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (release), runs: --release --target wasm32v1-none}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (contract profile), runs: --profile contract --target wasm32v1-none}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: Build native (release), runs: build -p rule-eval --release}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: Build wasm32v1-none (release), runs: --release --target wasm32v1-none}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: Build wasm32v1-none (contract profile), runs: --profile contract --target wasm32v1-none}

  - id: build.lint
    claim: The workspace passes clippy with every warning denied, and rustfmt.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: cargo clippy, runs: --all-targets --locked -- -D warnings}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: cargo fmt, runs: cargo fmt --all --check}

  - id: build.pins-agree
    claim: >-
      One Aeneas commit fixes the toolchain: the Charon input equals Aeneas's
      charon-pin, rust-toolchain.toml's channel equals Charon's, and the Lean
      release equals Aeneas's Lean backend's and formal/lean-toolchain;
      evaluating the flake fails otherwise, and the extraction evaluates it.
    status: tested
    evidence:
      - file: flake.nix
        contains: "assert pinsAgree;"
      - file: formal/lakefile.toml
        contains: rev = "ab34bd28458a08c150b7cbf1873e59af74588138"
      - ci: {workflow: .github/workflows/extraction.yml, job: extraction, step: Re-run Charon and Aeneas and compare, runs: tools/extract.sh --check}
      - ci: {workflow: .github/workflows/conformance.yml, job: regenerate, step: The generator uses the Lean release of formal/, runs: cmp formal/lean-toolchain conformance/generator/lean-toolchain}

  # CI gates on the Lean package and the extraction.

  - id: gate.lean-build
    claim: >-
      lake build builds every module of the package, every theorem included:
      RuleCore.lean imports every module, and the build fails otherwise.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: Every module is imported by RuleCore.lean}
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: lake build, runs: lake build}

  - id: gate.forbidden-keywords
    claim: >-
      No Lean source of the package, the translation included, nor of the
      vector generator contains sorry, admit, partial, unsafe, native_decide,
      implemented_by, extern or axiom as a word.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: Reject unchecked declarations, runs: "grep -nwE 'sorry|admit|partial|unsafe|native_decide|implemented_by|extern|axiom'"}
      - ci: {workflow: .github/workflows/conformance.yml, job: regenerate, step: Reject unchecked declarations, runs: "grep -nwE 'sorry|admit|partial|unsafe|native_decide|implemented_by|extern|axiom'"}

  - id: gate.axioms
    claim: >-
      Every theorem of the package depends on at most propext, Quot.sound and
      Classical.choice, and Axioms.lean records the axioms of every exported
      theorem under #guard_msgs, so a new theorem or a change in any theorem's
      axioms fails the build until the record is updated.
    status: tested
    evidence:
      - file: formal/RuleCore/Axioms.lean
        contains: "def permitted : List Name := [``propext, ``Quot.sound, ``Classical.choice]"
      - file: formal/RuleCore/Axioms.lean
        contains: "#guard_msgs in\n#print_package_axioms"
      - file: formal/lakefile.toml
        contains: roots = ["RuleCore", "RuleCore.Axioms"]
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: lake build, runs: lake build}

  - id: gate.extraction
    claim: >-
      formal/RuleCore/Extracted/RuleEval.lean is what Charon
      (--error-on-warnings) and Aeneas (-warnings-as-errors) generate from
      crates/rule-eval at the pinned versions; CI regenerates it and fails on
      any difference.
    status: tested
    evidence:
      - file: tools/extract.sh
        contains: "--preset=aeneas --error-on-warnings"
      - file: tools/extract.sh
        contains: "aeneas -backend lean -warnings-as-errors -abort-on-error"
      - ci: {workflow: .github/workflows/extraction.yml, job: extraction, step: Re-run Charon and Aeneas and compare, runs: tools/extract.sh --check}

  - id: gate.claims
    claim: >-
      Every claim in this ledger cites the evidence its status needs, and all
      of it exists; every cited theorem is a theorem of the built package.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/claims.yml, job: claims, step: Self-tests of the checker, runs: tools/tests/check_claims_test.py}
      - ci: {workflow: .github/workflows/claims.yml, job: claims, step: Check claims.yaml, runs: tools/check-claims}
      - ci: {workflow: .github/workflows/lean.yml, job: lean, step: Every claimed theorem is a theorem of the package, runs: tools/check-claims --theorems lean}

  # Stated and not proven.

  - id: unproven.narrower-converse
    claim: >-
      Narrower on the translation gives the model's narrower on the
      denotations. Only the other direction is proven (narrower_of_denote):
      model byte strings, argument lists and signer lists longer than
      Usize.max have no Rust counterpart.
    status: unproven
    evidence:
      - file: README.md
        contains: "narrower on the translation implies the model's narrower"

  - id: unproven.openzeppelin-signer-mapping
    claim: >-
      An OpenZeppelin context rule without policies corresponds to a rule here
      whose threshold is its number of distinct signers, and a rule with a
      simple_threshold policy of k to a threshold of k. This is read from
      OpenZeppelin's source at one commit, recorded as input for M4, and
      neither proven nor tested.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "A context rule without policies requires all of its signers."

  - id: unproven.openzeppelin-spending-limit
    claim: >-
      check_spend computes what the spending-limit policy's enforce in
      OpenZeppelin's stellar-accounts computes, at the theahaco fork commit
      Perch pins, except for the clock check, typed overflow refusals and
      purity. This is read from that source, and neither proven nor tested
      against it.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "`check_spend` follows the same steps in the same order."

  - id: unproven.history-bound-on-mainnet
    claim: >-
      A record of 816 or more entries does not fit in one mainnet contract-data
      entry, so on mainnet a shell's write fails before the 1000-entry bound
      refuses. This is read from upstream OpenZeppelin's source comment, and
      neither proven nor tested here.
    status: unproven
    evidence:
      - file: ARCHITECTURE.md
        contains: "past mainnet's `contractDataEntrySizeBytes` of 65,536 bytes"
