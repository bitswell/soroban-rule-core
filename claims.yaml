      - theorem: RuleCore.Attenuation.source_eq_of_ne_dropRule
      - theorem: RuleCore.Chain.Attenuation.source_denote_dropRule
      - theorem: RuleCore.Chain.Attenuation.source_denote_of_ne
      - theorem: RuleCore.Chain.RuleSet.emptyRecords_denote
      - theorem: RuleCore.Chain.RuleSet.authorizeAll_denote

  - id: authorize.caps-valid
    claim: >-
      The attenuation steps keep every cap valid (a positive limit and a
      nonzero period): a step from a rule set whose caps are all valid yields
      one whose caps are all valid, and so does every list of steps.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.attenuate_capsValid
      - theorem: RuleCore.RuleSet.attenuateAll_capsValid
      - theorem: RuleCore.Chain.RuleSet.attenuate_capsValid
      - theorem: RuleCore.Chain.RuleSet.attenuateAll_capsValid

  # Expiry, generations and authenticated signers (formal/RuleCore/Model,
  # theorems in RuleCore and RuleCore.Chain).

  - id: authorize.expiry
    claim: >-
      An accepted authorization chooses no rule whose last ledger is before
      the authorization's ledger: a rule authorizes up to and at its last
      ledger. allows and allowsAll read no last ledger.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.authorize_current
      - theorem: RuleCore.RuleSet.authorize_validUntil
      - theorem: RuleCore.Rule.expired_eq_false_iff
      - theorem: RuleCore.Authorization.map_snd_chosen
      - theorem: RuleCore.Chain.RuleSet.authorize_validUntil

  - id: authorize.generation
    claim: >-
      An accepted authorization chooses no rule issued under a generation
      other than the current one; so once the current generation is not g, a
      rule issued under g authorizes nothing, and a rule set every rule of
      which was issued under g accepts only an authorization with no
      contexts. Rules without a generation are unaffected.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.authorize_generation
      - theorem: RuleCore.RuleSet.authorize_not_chosen_of_stale
      - theorem: RuleCore.RuleSet.authorize_contexts_nil_of_stale
      - theorem: RuleCore.Rule.stale_eq_false_iff
      - theorem: RuleCore.Chain.RuleSet.authorize_generation
      - theorem: RuleCore.Chain.RuleSet.authorize_not_chosen_of_stale
      - theorem: RuleCore.Chain.RuleSet.authorize_contexts_nil_of_stale

  - id: authorize.steps-keep-generation
    claim: >-
      No attenuation step changes a rule's generation: each rule after a step,
      and after every chain of steps, carries the generation of the root rule
      it comes from, so every rule set derived from a root issued under g is
      issued under g.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.attenuate_generation
      - theorem: RuleCore.RuleSet.attenuateAll_generation
      - theorem: RuleCore.RuleSet.attenuateAll_generation_eq
      - theorem: RuleCore.Chain.RuleSet.attenuate_generation
      - theorem: RuleCore.Chain.RuleSet.attenuateAll_generation
      - theorem: RuleCore.Chain.RuleSet.attenuateAll_generation_eq
      - theorem: RuleCore.Chain.RuleSet.denote_get

  - id: authorize.signers-chosen
    claim: >-
      Every signer an accepted authorization authenticated is, by exact
      comparison, a signer of some rule it chose. allows and allowsAll make no
      such check, and only refuse more by its absence.
    status: proven
    evidence:
      - theorem: RuleCore.RuleSet.authorize_signers
      - theorem: RuleCore.Chain.RuleSet.authorize_signers

  # Budgets on the delegation tree (formal/RuleCore/Model/Budget.lean,
  # theorems in RuleCore.Budget).

  - id: budget.spend-charges
    claim: >-
      A successful spend at a node adds the amount to the spent amount of that
      node and of every ancestor up to its root, and changes nothing else: no
      other node, no node's parent or allowance, and not the number of nodes.
      It succeeds only on a well-formed tree, at an existing node, with a
      non-negative amount and a walk that reaches the root.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_ok_charges
      - theorem: RuleCore.Budget.Tree.spend_ok_unchanged
      - theorem: RuleCore.Budget.Tree.spend_ok_length
      - theorem: RuleCore.Budget.Tree.spend_ok_parentOf
      - theorem: RuleCore.Budget.Tree.spend_ok_allowance
      - theorem: RuleCore.Budget.Tree.spend_ok_iff
      - theorem: RuleCore.Budget.Tree.mem_walk
      - theorem: RuleCore.Budget.Tree.walk_fits

  - id: budget.refusal-changes-nothing
    claim: >-
      A refused spend, delegation or refill returns no tree, and a run keeps
      the tree it had and logs no spend.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.step_of_error
      - theorem: RuleCore.Budget.Tree.run_cons_of_error
      - theorem: RuleCore.Budget.Tree.logged_of_error

  - id: budget.overdrawn-names-nearest
    claim: >-
      The node an overdrawn refusal names is on the spender's chain and cannot
      take the amount, and every node before it on the chain, counting from
      the spender, can: it is the first node that would be overdrawn, the
      target of a refill request. A node cannot take an amount when its spent
      amount plus the amount exceeds its allowance or does not fit in an
      i128.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_overdrawn
      - theorem: RuleCore.Budget.Tree.walk_overdrawn
      - theorem: RuleCore.Budget.Tree.fits_iff

  - id: budget.refuses-only-what-it-must
    claim: >-
      On a well-formed tree, a spend of a non-negative amount at an existing
      node succeeds exactly when every node on its chain can take the amount,
      and is otherwise refused as overdrawn.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_accepts_iff
      - theorem: RuleCore.Budget.Tree.spend_error_overdrawn
      - theorem: RuleCore.Budget.Tree.walk_total
      - theorem: RuleCore.Budget.Tree.walk_error

  - id: budget.delegate-and-refill
    claim: >-
      A successful delegation appends exactly a child of an existing node
      with the given non-negative allowance and nothing spent, at the next
      index, without comparing the allowance with its parent's, so children's
      allowances may sum to more than their parent's; it is refused on a tree
      of maxNodes (u32::MAX) nodes. A successful refill raises exactly one
      node's allowance by a non-negative amount whose sum fits in an i128.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.delegate_ok_iff
      - theorem: RuleCore.Budget.Tree.refill_ok_iff

  - id: budget.well-formed
    claim: >-
      A tree is well formed when every node's parent index is below its own
      and no allowance or spent amount is negative; on a well-formed tree a
      node's ancestors have smaller indices, and every successful operation,
      and so every run, keeps the tree well formed.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.valid_iff
      - theorem: RuleCore.Budget.Tree.validFrom_iff
      - theorem: RuleCore.Budget.Tree.node_valid_iff
      - theorem: RuleCore.Budget.Tree.parent_lt
      - theorem: RuleCore.Budget.Tree.nonneg_of_valid
      - theorem: RuleCore.Budget.Tree.le_of_within
      - theorem: RuleCore.Budget.Tree.within_antisymm
      - theorem: RuleCore.Budget.Tree.spend_valid
      - theorem: RuleCore.Budget.Tree.delegate_valid
      - theorem: RuleCore.Budget.Tree.refill_valid
      - theorem: RuleCore.Budget.Tree.apply_valid
      - theorem: RuleCore.Budget.Tree.step_valid
      - theorem: RuleCore.Budget.Tree.run_valid

  - id: budget.within-allowance
    claim: >-
      Every node's spent amount stays within its allowance: every operation
      and every run preserves it.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spend_withinAllowance
      - theorem: RuleCore.Budget.Tree.delegate_withinAllowance
      - theorem: RuleCore.Budget.Tree.refill_withinAllowance
      - theorem: RuleCore.Budget.Tree.apply_withinAllowance
      - theorem: RuleCore.Budget.Tree.step_withinAllowance
      - theorem: RuleCore.Budget.Tree.run_withinAllowance
      - theorem: RuleCore.Budget.Tree.withinAllowance_iff

  - id: budget.safety
    claim: >-
      For every run of spends, delegations and refills, each node's spent
      amount is its spent amount before the run (nothing, for a node the run
      appended) plus the total successfully spent at or under it; from a
      well-formed tree with nothing spent, the total successfully spent at or
      under any node is that node's spent amount and never exceeds its
      allowance. Nothing relates allowances to each other, so the bound holds
      however much children's allowances oversubscribe their parent's. A run
      never removes a node or changes an existing node's parent.
    status: proven
    evidence:
      - theorem: RuleCore.Budget.Tree.spentUnder_le_allowance
      - theorem: RuleCore.Budget.Tree.spentUnder_eq_spent
      - theorem: RuleCore.Budget.Tree.spent_run
      - theorem: RuleCore.Budget.Tree.step_spent
      - theorem: RuleCore.Budget.Tree.run_extends
      - theorem: RuleCore.Budget.Tree.step_extends
      - theorem: RuleCore.Budget.Tree.within_of_walk
      - theorem: RuleCore.Budget.Tree.within_root
      - theorem: RuleCore.Budget.Tree.within_step
      - theorem: RuleCore.Budget.Tree.within_trans

  # Documents and their lowering (formal/RuleCore/Vocab/Document.lean,
  # Vocab/Lowering.lean, Vocab/Account.lean; theorems in RuleCore.Document).

  - id: document.compile-soundness
    claim: >-
      For every valid document, account and generation, each rule a document
      rule lowers to allows exactly the contexts the document rule allows
      under every authenticated signer list, written from Perch's
      specification (contract or self-admin scope, function list or every
      function, transfer only with an i128 at argument 2 for a capped rule,
      each argument predicate as Perch's program leaves read it, all or
      at least m of the named signers); the rules a document's rules lower to
      allow exactly what the document allows; and the admin document's
      lowering allows what the document allows or what the recovery rule
      allows, exactly what the document allows when no recovery is
      configured.
    status: proven
    evidence:
      - theorem: RuleCore.Document.Doc.lowerRule_allows
      - theorem: RuleCore.Document.Doc.lowerRules_allows
      - theorem: RuleCore.Document.Doc.lower_allows
      - theorem: RuleCore.Document.Doc.lower_allows_of_recovery_none
      - theorem: RuleCore.Document.Rule.mem_lowerFunctions
      - theorem: RuleCore.Document.Rule.covers_iff
      - theorem: RuleCore.Document.amountCond_holds
      - theorem: RuleCore.Document.i128Max_toInt
      - theorem: RuleCore.Document.Pred.lower_holds
      - theorem: RuleCore.Document.Rule.lowerConds_all
      - theorem: RuleCore.Document.Rule.signed_lowerRule
      - theorem: RuleCore.Document.RuleSet.allows_eq_any
      - theorem: RuleCore.Document.eraseDups_of_nodup

  - id: document.compile-soundness-authorize
    claim: >-
      Through authorize, for every valid document and every authorization:
      the admin document's lowering accepts exactly when the document's own
      check accepts (one rule per context, each live at the ledger, in the
      issue's generation when it has one, and allowing its context; every
      authenticated signer named by a chosen rule; each capped rule's spend
      charged with the cap model), with the recovery controller's check read
      as every call to apply_doc, and returns the same records; with no
      recovery configured, exactly the document's acceptance whatever the
      controller's check.
    status: proven
    evidence:
      - theorem: RuleCore.Document.Doc.lower_authorize
      - theorem: RuleCore.Document.Doc.lower_authorize_of_recovery_none
      - theorem: RuleCore.Document.Doc.authorize_lowerAll
      - theorem: RuleCore.Document.Doc.authorize_of_recovery_none
      - theorem: RuleCore.Document.Doc.authorize_eq_some_iff
      - theorem: RuleCore.Document.Doc.checkChoice_lower
      - theorem: RuleCore.Document.Doc.signerChosen_lower
      - theorem: RuleCore.Document.Doc.charge_lower
      - theorem: RuleCore.Document.Doc.foldlM_charge_lower
      - theorem: RuleCore.Document.Doc.lowerAll_eq_map
      - theorem: RuleCore.Document.Doc.mem_rules_of_installed
      - theorem: RuleCore.Document.Doc.lastLedger_toNat
      - theorem: RuleCore.Document.toOption_eq_some
      - theorem: RuleCore.Document.toOption_eq_of_iff

  - id: document.recovery-over-approximation
    claim: >-
      The recovery rule is the one lowered construct that over-approximates:
      it allows every call to the account's apply_doc, under any signers,
      and nothing else; the document's acceptance only grows with the
      controller's check, so every authorization the document accepts under
      a controller check that accepts only calls to apply_doc, the admin
      document's lowering accepts, with the same records.
    status: proven
    evidence:
      - theorem: RuleCore.Document.recoveryRule_allows
      - theorem: RuleCore.Document.Doc.authorize_mono
      - theorem: RuleCore.Document.Doc.lower_authorize_of_check

  - id: scoped.compile-soundness
    claim: >-
      A scoped document's lowering, when it is not refused, is the document's
      rules lowered with the generation, and for a valid scoped document it
      allows exactly what the document allows and, through authorize,
      accepts exactly what the document issued under that generation accepts,
      with the same records.
    status: proven
    evidence:
      - theorem: RuleCore.Document.Doc.lowerScoped_eq_ok
      - theorem: RuleCore.Document.Doc.lowerRules_eq_append
      - theorem: RuleCore.Document.Doc.lowerScoped_allows
      - theorem: RuleCore.Document.Doc.lowerScoped_authorize

  - id: scoped.exclusion
    claim: >-
      Every rule a scoped document lowers to applies to a contract that is
      neither the account nor in the excluded set; no rule set it lowers to,
      and no rule set any chain of attenuation steps derives from one, allows
      a call to the account or to a contract of the excluded set, under any
      signers; the excluded set the admin document gives holds the account,
      its recovery controller and its zero-knowledge adapter and pool.
    status: proven
    evidence:
      - theorem: RuleCore.Document.Doc.lowerScoped_contract
      - theorem: RuleCore.Document.Doc.lowerScoped_allows_excluded
      - theorem: RuleCore.Document.Doc.lowerScoped_attenuateAll_excluded
      - theorem: RuleCore.Document.Doc.mem_excluded

  - id: scoped.generation
    claim: >-
      Every rule a scoped document lowers to carries the generation it was
      issued under, and no admin rule carries one, so admin rules authorize
      the same in every generation. In the account model a run keeps the
      address and advances the generation by exactly the recoveries it
      completes; after a run that completes a recovery, a grant attenuated
      from a scoped document issued before it accepts only the empty batch
      in the account's generation.
    status: proven
    evidence:
      - theorem: RuleCore.Document.Doc.lowerScoped_generation
      - theorem: RuleCore.Document.Doc.lower_generation
      - theorem: RuleCore.Document.RuleSet.authorize_generation_none
      - theorem: RuleCore.Document.Account.step_address
      - theorem: RuleCore.Document.Account.run_address
      - theorem: RuleCore.Document.Account.run_generation
      - theorem: RuleCore.Document.Account.issued_stale
      - theorem: RuleCore.Document.Account.adminRules_authorize_generation

  - id: chain.containment
    claim: >-
      The containment chain: anything authorize accepts under a grant
      attenuated from the rules a valid scoped document was issued as is
      allowed by that scoped document, touches neither the account nor its
      recovery controller, ZK adapter or pool, and is made in the generation
      the document was issued under; every run the grant accepts from empty
      records, the scoped rules accept, with each choice renumbered, and the
      scoped rules accept exactly what the document does; once the account
      completes a recovery, the grant accepts only the empty batch while the
      admin rules authorize as before.
    status: proven
    evidence:
      - theorem: RuleCore.Document.Account.chain
      - theorem: RuleCore.Document.Account.chain_trace
      - theorem: RuleCore.Document.Account.chain_after_recovery

  # The Soroban models (formal/RuleCore/Soroban, theorems in
  # RuleCore.Soroban).

  - id: soroban.storage-map
    claim: >-
      In the Soroban model, contract storage is a finite map: a slot reads
      what was last written to it, a write or a removal changes no other
      slot, the same key under another durability or in another contract's
      storage is another slot, and an operation is refused, changing nothing,
      exactly when its key holds a muxed address.
    status: proven
    evidence:
      - theorem: RuleCore.Soroban.Store.get_set
      - theorem: RuleCore.Soroban.Store.get_set_ne
      - theorem: RuleCore.Soroban.Store.get_remove
      - theorem: RuleCore.Soroban.Store.get_remove_ne
      - theorem: RuleCore.Soroban.Store.has_iff
      - theorem: RuleCore.Soroban.Store.get_set_durability
