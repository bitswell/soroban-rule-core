      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: "Build the facade, wasm32v1-none (contract profile)", runs: --features sdk --profile contract --target wasm32v1-none}
      - ci: {workflow: .github/workflows/rust.yml, job: stable, step: "Build the facade, wasm32v1-none (contract profile)", runs: --features sdk --profile contract --target wasm32v1-none}

