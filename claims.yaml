      - test: rule-eval/authorize::two_contexts_charging_one_rule_accumulate
      - test: rule-eval/authorize::rules_with_their_own_caps_keep_their_own_records
      - test: rule-eval/authorize::a_refused_authorization_discards_the_charges_before_it
      - test: rule-eval/authorize::the_window_rolls
      - test: rule-eval/authorize::an_empty_batch_is_authorized_and_changes_nothing
      - test: rule-eval/authorize::caps_hold_across_contexts_that_choose_different_rules
      - test: rule-eval/authorize::a_rule_without_a_cap_keeps_its_record
      - test: rule-eval/authorize::a_cap_reads_only_its_own_amount_argument
      - test: rule-eval/authorize::caps_are_valid_with_a_positive_limit_and_a_nonzero_period
      - test: rule-eval/authorize::add_cap_caps_that_rule_only_and_refuses_a_capped_rule_or_an_invalid_cap
      - test: rule-eval/authorize::lower_cap_limit_lowers_that_limit_only
      - test: rule-eval/authorize::lengthen_cap_period_lengthens_that_period_only
      - test: rule-eval/authorize::the_other_steps_keep_each_rule_cap
      - test: rule-eval/authorize::cap_steps_leave_every_verdict_as_it_was

  - id: tested.budget
    claim: >-
      spend, delegate and refill agree with a plain Rust reading of the
      operations on 152,355 inputs (1,451 trees of up to three nodes, well
      formed or not, with five indices and seven amounts each, the i128
      extremes included); over 300 random runs of 40 operations, each node's
