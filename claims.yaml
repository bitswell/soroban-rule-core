      - test: rule-eval/budget::a_refusal_leaves_the_tree_as_it_was

  # Conformance vectors (conformance/).

  - id: conformance.from-model
    claim: >-
      The committed vectors in conformance/vectors, cap traces in
      conformance/vectors/caps, authorization traces in
      conformance/vectors/authorize and budget traces in
      conformance/vectors/budget are exactly what the Lean model computes:
      regenerating them into an empty directory gives no difference.
    status: tested
    evidence:
      - ci: {workflow: .github/workflows/conformance.yml, job: regenerate, step: Regenerate the vectors and compare, runs: diff -r conformance/vectors}
      - file: conformance/vectors

  - id: conformance.rule-eval-agrees
    claim: >-
      rule-eval returns every verdict and attenuation result of every vector;
      the vectors cover every value constructor, condition, signer kind,
      repeated signers, each threshold case, rules with and without caps,
      each of the eight step kinds and every outcome; a vector with a changed
      expectation is reported.
    status: tested
    evidence:
      - test: rule-eval-conformance/vectors::rule_eval_agrees_with_every_vector
      - test: rule-eval-conformance/vectors::vectors_cover_every_kind
      - test: rule-eval-conformance/vectors::a_wrong_expectation_is_reported
      - test: rule-eval-conformance/vectors::hex_is_lowercase_and_even
