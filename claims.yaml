        contains: "[dependencies]\n"
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (release), runs: --target wasm32v1-none}

  - id: build.overflow-checks
    claim: Arithmetic overflow traps in the release and contract profiles.
    status: tested
    evidence:
      - file: Cargo.toml
        contains: "[profile.release]\noverflow-checks = true"
      - file: Cargo.toml
        contains: "[profile.contract]\ninherits = \"release\"\nopt-level = \"z\"\noverflow-checks = true"
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build native (release), runs: --release}
      - ci: {workflow: .github/workflows/rust.yml, job: pinned, step: Build wasm32v1-none (contract profile), runs: --profile contract}

  - id: build.facade
    claim: >-
      soroban-facade is no_std and forbids unsafe code; rule-eval does not
      depend on it; it builds for native and for wasm32v1-none in the
      contract profile, with and without its real implementation over
      soroban-sdk, on the pinned nightly and on stable.
