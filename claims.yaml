      - test: rule-eval/authorize::every_short_run_stays_within_every_window
      - test: rule-eval/authorize::every_step_is_trace_inclusion
      - test: rule-eval/authorize::choices_and_records_must_match_their_lists
      - test: rule-eval/authorize::a_chosen_rule_must_exist_and_allow_its_context
