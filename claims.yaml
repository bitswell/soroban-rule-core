  - id: soroban.reading-for-rule-eval
    claim: >-
      What rule-eval reads of a Soroban context (AuthFn.toChain): a call is a
      call of the contract's ScAddress XDR with each argument read; a
      creation is a creation, which no rule allows, of its executable's
      identity: the Wasm hash, or the XDR of an external reference, which is
      longer than any hash; a u32 is other of
      u32Xdr, the reading Perch's lowering compares a u32 with; a value is
      read as an i128, u64, bool, bytes, string or symbol only when it is
      one, and as an address's XDR only when it is that address, since no two
      addresses share an XDR.
    status: proven
    evidence:
      - theorem: RuleCore.Soroban.AuthFn.toChain_contract
      - theorem: RuleCore.Soroban.AuthFn.toChain_create
