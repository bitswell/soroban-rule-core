name: Lean

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean (lake build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # elan reads formal/lean-toolchain and installs that Lean release on the
      # first `lake` call.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The proofs must not rely on anything the kernel does not check.
      # RuleCore/Axioms.lean separately pins each theorem's axioms.
      - name: Reject unchecked declarations
        run: |
          if find . -name '*.lean' -not -path './.lake/*' -print0 \
              | xargs -0 grep -nwE 'sorry|admit|partial|unsafe|native_decide|implemented_by|extern|axiom'; then
            echo "::error::forbidden keyword in the Lean sources"
            exit 1
          fi

      # RuleCore/Axioms.lean sees exactly the modules RuleCore.lean imports.
      - name: Every module is imported by RuleCore.lean
        run: |
          missing=0
          while IFS= read -r file; do
            module="${file%.lean}"
            module="${module//\//.}"
            if ! grep -qxF "import $module" RuleCore.lean; then
              echo "::error file=formal/$file::$module is not imported by RuleCore.lean"
              missing=1
            fi
          done < <(find RuleCore -name '*.lean' -not -path 'RuleCore/Axioms.lean' | sort)
          exit "$missing"

      - name: lake build
        run: lake build
